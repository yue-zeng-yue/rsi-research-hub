<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">RSI Research Hub</title>
  <desc id="desc">A dark research atlas with cyan and violet nested recursive orbits. Understanding systems that improve themselves.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080F20"/><stop offset="0.55" stop-color="#101A36"/><stop offset="1" stop-color="#17132F"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#4269D9" stop-opacity="0.23"/><stop offset="1" stop-color="#4269D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spectrum" x1="-160" y1="-160" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75EAF2"/><stop offset="0.48" stop-color="#78A7FF"/><stop offset="1" stop-color="#B291FF"/>
    </linearGradient>
    <linearGradient id="line" x1="64" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66E3EA"/><stop offset="1" stop-color="#66E3EA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#91AAE8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="440" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="440" rx="24" fill="url(#background)"/>
    <rect width="1280" height="440" fill="url(#grid)"/>
    <ellipse cx="964" cy="221" rx="388" ry="310" fill="url(#aura)"/>
    <path d="M64 97H640" stroke="url(#line)"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <circle cx="70" cy="65" r="4" fill="#6CE5ED"/>
      <text x="86" y="71" fill="#A6B8D7" font-size="16" font-weight="500" letter-spacing="3">RECURSIVE SELF-IMPROVEMENT</text>
      <text x="60" y="206" fill="#EFF6FF" font-size="112" font-weight="750" letter-spacing="-6">RSI</text>
      <text x="65" y="265" fill="#EDF4FF" font-size="49" font-weight="650" letter-spacing="2">RESEARCH HUB</text>
      <text x="66" y="313" fill="#ADBEDB" font-size="23">Understanding systems</text>
      <text x="66" y="343" fill="#ADBEDB" font-size="23">that improve themselves.</text>
      <g font-size="13" font-weight="600" letter-spacing="1.7">
        <rect x="66" y="374" width="104" height="30" rx="15" fill="#152C3F" stroke="#345568"/>
        <text x="86" y="394" fill="#8DE9EF">MODEL</text>
        <rect x="180" y="374" width="126" height="30" rx="15" fill="#1B2847" stroke="#3A4D73"/>
        <text x="198" y="394" fill="#A9CAFF">HARNESS</text>
        <rect x="316" y="374" width="184" height="30" rx="15" fill="#24223F" stroke="#4A456C"/>
        <text x="334" y="394" fill="#C4B6F8">META-LEARNING</text>
      </g>
    </g>
    <g transform="translate(974 222)">
      <circle r="181" stroke="#8599CF" stroke-opacity="0.14" stroke-dasharray="2 9"/>
      <circle r="155" stroke="#7F9DD8" stroke-opacity="0.17"/>
      <path d="M-152-31A155 155 0 0 1 126-90" stroke="url(#spectrum)" stroke-width="2"/>
      <path d="M152 31A155 155 0 0 1-126 90" stroke="#9A86E8" stroke-width="2"/>
      <path d="M126-90l-12-2 5 12" fill="#8EB8FF"/>
      <path d="M-126 90l12 2-5-12" fill="#9A86E8"/>
      <g stroke="url(#spectrum)">
        <rect x="-106" y="-106" width="212" height="212" rx="39" transform="rotate(24)" stroke-width="1.7" opacity="0.68"/>
        <rect x="-80" y="-80" width="160" height="160" rx="30" transform="rotate(9)" stroke-width="2" opacity="0.85"/>
        <rect x="-58" y="-58" width="116" height="116" rx="23" transform="rotate(-6)" stroke-width="2"/>
        <rect x="-39" y="-39" width="78" height="78" rx="17" transform="rotate(-21)" stroke-width="2"/>
      </g>
      <path d="M-20 2C-20-19-5-19 0 0S20 19 20-2C20-22 5-19 0 0S-20 21-20 2Z" stroke="#90E9F8" stroke-width="3"/>
      <g fill="#85EAF5">
        <circle cx="-146" cy="-52" r="8" opacity="0.6" filter="url(#glow)"/>
        <circle cx="-146" cy="-52" r="4"/>
        <circle cx="77" cy="-134" r="3"/>
      </g>
      <circle cx="105" cy="114" r="4" fill="#B89AFF"/>
      <path d="M-146-52h-42l-23-23h-55M105 114h58l20 20h28M77-134v-26l23-23h47" stroke="#617BA9" stroke-opacity="0.65"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2">
      <text x="677" y="138" fill="#85C6DC">PROPOSE</text>
      <text x="1117" y="376" fill="#B7A2EB">EVALUATE</text>
      <text x="1126" y="43" fill="#96B7E7">RETAIN</text>
      <text x="875" y="424" fill="#6D82AA" font-size="11" letter-spacing="3">THE NEXT IMPROVEMENT LOOP</text>
    </g>
    <rect x="0.5" y="0.5" width="1279" height="439" rx="23.5" stroke="#6074A6" stroke-opacity="0.24"/>
  </g>
</svg>
